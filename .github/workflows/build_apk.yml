name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v5

      # 2. Setup Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # 3. Setup Java
      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. Cache Android and Gradle files
      - name: Cache Buildozer and Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 5. Install Linux dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential

      # 6. Install Buildozer
      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython virtualenv

      # 7. Accept Android SDK licenses
      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          if [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          else
            echo "Android SDK manager not found yet."
            echo "Buildozer will download/setup the Android SDK."
            exit 0
          fi

          yes | "$SDKMANAGER" --licenses || true

      # 8. Build APK and preserve logs
      - name: Build Android APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer.log

      # 9. Upload APK after successful build
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: OCR_Number_Scanner_APK
          path: bin/*.apk
          if-no-files-found: error

      # 10. Upload logs even if build fails
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Buildozer_Debug_Log
          path: buildozer.log
          if-no-files-found: warn
